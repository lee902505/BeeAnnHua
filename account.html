<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#171329" />
  <title>绑定云端账号 · 星辰日记</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","PingFang TC","Microsoft YaHei","Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:#fff8ee; background:radial-gradient(circle at 76% 4%,rgba(119,100,194,.34),transparent 34%),radial-gradient(circle at 8% 85%,rgba(226,185,205,.12),transparent 30%),linear-gradient(145deg,#151126,#211736 58%,#151126); }
    main { width:min(820px,calc(100% - 28px)); margin:0 auto; padding:max(36px,env(safe-area-inset-top)) 0 calc(56px + env(safe-area-inset-bottom)); }
    .eyebrow { color:#dbc49c; letter-spacing:.17em; font-size:12px; font-weight:650; }
    h1 { margin:9px 0 12px; font-size:clamp(34px,7vw,54px); letter-spacing:-.03em; }
    .lead { margin:0 0 24px; color:#d9cfdf; line-height:1.85; }
    .card { padding:22px; border:1px solid rgba(226,195,146,.34); border-radius:24px; background:rgba(21,15,34,.78); box-shadow:0 26px 76px rgba(0,0,0,.3); }
    .status-grid { display:grid; gap:0; margin-bottom:18px; border-bottom:1px solid rgba(255,255,255,.08); }
    .row { display:grid; grid-template-columns:150px minmax(0,1fr); gap:14px; padding:11px 0; border-top:1px solid rgba(255,255,255,.07); }
    .row:first-child { border-top:0; }
    .label { color:#bfb0c9; }
    .value { overflow-wrap:anywhere; font-weight:600; }
    .support { margin:16px 0; padding:14px 16px; border-radius:15px; color:#d9cfdf; background:rgba(255,255,255,.045); line-height:1.7; }
    label { display:block; margin:18px 0 8px; color:#dbc49c; font-size:13px; font-weight:650; }
    input { width:100%; min-height:50px; padding:13px 14px; color:#fff; background:#100c19; border:1px solid rgba(226,195,146,.28); border-radius:14px; font:inherit; outline:none; }
    input:focus { border-color:rgba(232,201,151,.68); box-shadow:0 0 0 3px rgba(226,195,146,.08); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    button,.btn { appearance:none; border:1px solid rgba(226,195,146,.55); background:#f3e4d2; color:#2b2038; border-radius:999px; padding:12px 18px; font:650 14px/1 inherit; cursor:pointer; text-decoration:none; }
    button.secondary,.btn.secondary { background:transparent; color:#f5e8d8; }
    button:disabled { opacity:.52; cursor:wait; }
    .account-message { margin:18px 0 0; padding:14px 16px; border-radius:14px; line-height:1.65; background:rgba(255,255,255,.05); }
    .account-message.ok { border:1px solid rgba(159,226,193,.48); color:#d9f7e7; }
    .account-message.bad { border:1px solid rgba(239,157,174,.48); color:#ffdce4; }
    .pending { margin-top:18px; padding:15px 16px; border:1px dashed rgba(226,195,146,.34); border-radius:16px; background:rgba(245,228,210,.035); }
    .pending strong { color:#f0d6aa; }
    .pending small,.bound-box p,.manual { display:block; margin-top:8px; color:#bfb0c9; line-height:1.7; }
    .bound-box { margin-top:16px; padding:18px; border:1px solid rgba(159,226,193,.28); border-radius:18px; background:rgba(159,226,193,.045); }
    .manual { margin:20px 0 0; font-size:13px; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media (max-width:620px) { .row,.split { grid-template-columns:1fr; } main { width:min(100% - 20px,820px); } .card { padding:18px; border-radius:20px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title">绑定云端账号</h1>
    <p class="lead" id="lead"></p>

    <section class="card">
      <div class="status-grid">
        <div class="row"><div class="label" id="identityLabel"></div><div class="value" id="identityValue">检查中…</div></div>
        <div class="row"><div class="label" id="uuidLabel"></div><div class="value" id="uuidValue">—</div></div>
        <div class="row"><div class="label" id="emailStatusLabel"></div><div class="value" id="emailValue">—</div></div>
      </div>

      <div id="bindForm">
        <p class="support" id="supportText"></p>
        <label for="emailInput" id="emailLabel"></label>
        <input id="emailInput" type="email" inputmode="email" autocomplete="email" />
        <div class="actions">
          <button id="sendBtn" type="button"></button>
          <button id="resendBtn" type="button" class="secondary"></button>
        </div>

        <div class="pending" id="pendingRow" hidden>
          <strong><span id="pendingTitle">待确认邮箱</span>：<span id="pendingValue">—</span></strong>
          <small id="pendingHint"></small>
        </div>

        <div class="split">
          <div>
            <label for="otpInput" id="otpLabel"></label>
            <input id="otpInput" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
          </div>
          <div style="display:flex;align-items:end">
            <button id="verifyBtn" type="button" style="width:100%;min-height:50px"></button>
          </div>
        </div>
      </div>

      <div class="bound-box" id="boundBox" hidden>
        <strong>✓ Account bound</strong>
        <p id="boundHint"></p>
      </div>

      <div id="message" class="account-message" hidden></div>

      <div class="actions" style="margin-top:22px">
        <button id="syncBtn" type="button" class="secondary"></button>
        <a id="backBtn" class="btn secondary" href="index.html"></a>
      </div>
      <p class="manual" id="manualNote"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=0.10.7.5"></script>
  <script src="js/supabase-client.js?v=0.10.7.5"></script>
  <script src="js/supabase-auth.js?v=0.10.7.5"></script>
  <script src="js/cloud-sync.js?v=0.10.7.5"></script>
  <script src="js/account-binding.js?v=0.10.7.5"></script>
  <script src="js/account-page.js?v=0.10.7.5"></script>
</body>
</html>
