<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>专属提督碎片系统 🧩</title>
    <style>
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            padding: 25px 20px;
            box-sizing: border-box;
            background: linear-gradient(145deg, #1f1f3a, #161625);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00d2d3;
            font-size: 22px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .score-board {
            background: rgba(255, 255, 255, 0.05);
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #00d2d3;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 210, 211, 0.15);
        }
        .score-title {
            font-size: 14px;
            color: #a4b0be;
            margin-bottom: 8px;
        }
        .score-value {
            font-size: 40px;
            font-weight: 800;
            color: #feca57;
            text-shadow: 0 2px 10px rgba(254, 202, 87, 0.3);
            transition: all 0.3s ease;
        }
        .score-total { font-size: 18px; color: #ffffff; }
        
        /* 独立许愿券样式 */
        .wish-board {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 118, 117, 0.3);
            font-size: 16px;
            color: #ff7675;
            font-weight: bold;
        }

        .section {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .section h3 { margin: 0 0 10px 0; color: #ff9ff3; font-size: 18px; }
        .section p { font-size: 13px; color: #ced6e0; margin-bottom: 10px; line-height: 1.4; }
        .rules { font-size: 12px; color: #feca57; background: rgba(254, 202, 87, 0.1); padding: 8px; border-radius: 8px; margin-bottom: 15px; text-align: left; line-height: 1.5; }
        
        .dice-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 15px 0; min-height: 70px; }
        .dice-wrapper { display: flex; flex-direction: column; align-items: center; }
        .dice { font-size: 45px; line-height: 1; margin-bottom: 2px; }
        .dice-desc { font-size: 14px; color: #00d2d3; min-height: 44px; margin-bottom: 15px; line-height: 1.4; }
        .btn-group { display: flex; gap: 8px; width: 100%; }
        
        .blind-box-container { margin: 15px 0; min-height: 120px; position: relative; }
        .box-icon { font-size: 70px; display: inline-block; filter: drop-shadow(0 0 10px rgba(255, 159, 243, 0.4)); }
        .box-icon.shake { animation: shakeBox 0.4s infinite; }
        .box-results-wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        .drawn-item { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; width: 38%; animation: popUp 0.4s ease forwards; }
        .drawn-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .drawn-title { font-size: 13px; font-weight: bold; margin-bottom: 3px; }
        .drawn-pt { font-size: 12px; font-weight: bold; }

        @keyframes shakeBox { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-10deg) scale(1.05); } 75% { transform: rotate(10deg) scale(1.05); } }
        @keyframes popUp { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        button { background: linear-gradient(135deg, #00d2d3, #0984e3); color: #ffffff; border: none; padding: 12px 0; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); transition: transform 0.1s; }
        button:active { transform: scale(0.96); }
        .btn-5 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .btn-10 { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .btn-box1 { background: linear-gradient(135deg, #ff9ff3, #f368e0); }
        .btn-box10 { background: linear-gradient(135deg, #ff7675, #d63031); }
        
        .fortune-text { font-size: 24px; font-weight: bold; margin: 15px 0 5px 0; }
        .fortune-desc { font-size: 14px; color: #00d2d3; min-height: 42px; margin-bottom: 15px; line-height: 1.4; }
        .tips { font-size: 12px; color: #747d8c; margin-top: auto; padding-top: 10px; text-align: center; line-height: 1.6; padding-bottom: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🧩 专属提督碎片系统 🧩</h1>
    
    <div class="score-board">
        <div class="score-title">当前持有碎片 (实时更新)</div>
        <div class="score-value" id="displayScore">0<span class="score-total"> / 990</span></div>
        <div class="wish-board">
            🎟️ 专属许愿券: <span id="displayWish" style="font-size: 22px;">0</span> 张
        </div>
    </div>

    <!-- 🎁 盲盒模块 -->
    <div class="section" style="border: 1px solid rgba(255, 159, 243, 0.3); box-shadow: 0 0 15px rgba(255, 159, 243, 0.1);">
        <h3 style="color: #ff9ff3;">🎁 惊喜盲盒抽奖</h3>
        <p>单次消耗 <b style="color:#feca57;">1.5 积分</b></p>
        
        <!-- 🔧 GM 专属修改区：活动文字说明 -->
        <div style="background: rgba(0,0,0,0.3); border: 1px solid #a4b0be; padding: 5px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; color: #fff;">
            当前活动：<span style="color:#1dd1a1; font-weight:bold;">日常基础爆率</span>
        </div>
        
        <div class="blind-box-container">
            <div class="box-icon" id="boxIcon">🎁</div>
            <div class="box-results-wrap" id="boxResultList" style="display:none;"></div>
            <div id="boxSummary" style="display:none; margin-top:12px; font-size:14px; color:#00d2d3; font-weight:bold;"></div>
        </div>
        
        <div class="btn-group">
            <button class="btn-box1" onclick="openBlindBox(1)" style="flex: 1;">单抽 (1.5分)</button>
            <button class="btn-box10" onclick="openBlindBox(10)" style="flex: 1.2;">十连抽 (15分)</button>
        </div>
    </div>

    <!-- 🎲 骰子模块 (无限免费版) -->
    <div class="section">
        <h3>🎲 命运盲盒骰子</h3>
        <p>系统自动实时结算增减分数</p>
        <div class="rules">
            6点: +3分 | 5点: +2分 | 4点: 0分<br>
            3点: -1分 &nbsp;| 2点: -2分 | 1点: -3分<br>
            <span style="color:#1dd1a1; font-weight:bold;">* 本玩法永久免费，无限畅玩！盈亏自负！</span>
        </div>
        
        <div class="dice-container" id="diceResult">
            <div class="dice-wrapper"><div class="dice">❓</div></div>
        </div>
        
        <div class="dice-desc" id="diceDesc" style="min-height: 20px;"></div>
        
        <div class="btn-group">
            <button onclick="rollDice(1)" style="flex: 1;">掷 1 次</button>
            <button onclick="rollDice(5)" class="btn-5" style="flex: 1;">连抽 5 次</button>
            <button onclick="rollDice(10)" class="btn-10" style="flex: 1.2;">十连抽！</button>
        </div>
    </div>

    <!-- 🔮 占卜模块 -->
    <div class="section">
        <h3>🔮 每日运势占卜</h3>
        <p>每日限抽一次，分数自动实时入账</p>
        <div class="fortune-text" id="fortuneResult">等待抽签...</div>
        <div class="fortune-desc" id="fortuneDesc"></div>
        <button onclick="drawFortune()" id="fortuneBtn">抽取今日运势</button>
    </div>

    <div class="tips">
        * 本客户端由 奕奕哥哥 独家开发维运<br>
        * 系统一切最终解释权归 GM 所有
    </div>
</div>

<script>
    // --- 核心分数与许愿券管理 ---
    let currentScore = parseFloat(localStorage.getItem('tidu_score') || '-1'); 
    let currentWish = parseInt(localStorage.getItem('tidu_wishTickets') || '0');
    let isSystemBusy = false; 

    function updateScoreUI(scoreChange = 0, wishChange = 0) {
        if(scoreChange !== 0) {
            currentScore += scoreChange;
            currentScore = Math.round(currentScore * 10) / 10; 
            localStorage.setItem('tidu_score', currentScore.toString());
        }
        if(wishChange !== 0) {
            currentWish += wishChange;
            currentWish = Math.max(0, currentWish); // 许愿券不能为负数
            localStorage.setItem('tidu_wishTickets', currentWish.toString());
        }
        document.getElementById('displayScore').innerHTML = currentScore + '<span class="score-total"> / 990</span>';
        document.getElementById('displayWish').innerText = currentWish;
    }
    updateScoreUI(0, 0); // 初始渲染

    // --- GM 魔法连结 (支援增减许愿券) ---
    const urlParams = new URLSearchParams(window.location.search);
    const addScore = urlParams.get('add'); 
    const setScore = urlParams.get('set'); 
    const addWish = urlParams.get('addWish'); 
    const setWish = urlParams.get('setWish'); 
    const key = urlParams.get('key');      

    if ((addScore || setScore || addWish || setWish) && key) {
        let usedKeys = JSON.parse(localStorage.getItem('tidu_usedKeys') || '[]');
        if (usedKeys.includes(key)) {
            alert("温馨提示：这条魔法连结已经失效啦～");
        } else {
            let msg = "🎉 成功接收 GM 指令：\n";
            if (setScore) {
                currentScore = parseFloat(setScore);
                msg += `碎片已校正为：${currentScore}\n`;
            } else if (addScore) {
                currentScore += parseFloat(addScore);
                currentScore = Math.round(currentScore * 10) / 10; 
                msg += `碎片变更：${parseFloat(addScore) > 0 ? '+'+addScore : addScore}\n`;
            }
            
            if (setWish) {
                currentWish = parseInt(setWish);
                msg += `许愿券已校正为：${currentWish}\n`;
            } else if (addWish) {
                currentWish += parseInt(addWish);
                msg += `许愿券变更：${parseInt(addWish) > 0 ? '+'+addWish : addWish}\n`;
            }

            localStorage.setItem('tidu_score', currentScore.toString());
            localStorage.setItem('tidu_wishTickets', Math.max(0, currentWish).toString());
            updateScoreUI(0, 0);
            alert(msg);
            
            usedKeys.push(key);
            localStorage.setItem('tidu_usedKeys', JSON.stringify(usedKeys));
        }
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // --- 每日状态重置 ---
    let today = new Date().toDateString();
    if (localStorage.getItem('tidu_dailyDate') !== today) {
        localStorage.setItem('tidu_dailyDate', today);
        localStorage.setItem('tidu_diceCount', '0');
        localStorage.removeItem('tidu_dailyFortune'); 
    }

// ==========================================
    // 🎁 惊喜盲盒逻辑 (温水煮青蛙 - 极低感亏损版)
    // ==========================================
    function getBoxRewards() {
        // 总期望值精算约为 0.993。每次消耗 1.5 积分，维持绝对的回收机制。
        return [
            { weight: 5, title: "🏰 浪漫城堡", desc: "+100 碎片", color: "#ff9ff3", img: "images/0001.png", pt: 100, isWish: false },  // 0.05%
            { weight: 10, title: "🐎 神驹宝玺", desc: "+30 碎片", color: "#1dd1a1", img: "images/0002.png", pt: 30, isWish: false },   // 0.1%
            { weight: 20, title: "🔭 时空之站", desc: "+20 碎片", color: "#48dbfb", img: "images/0003.png", pt: 20, isWish: false },    // 0.2%
            { weight: 80, title: "🪄 绚彩权杖", desc: "+10 碎片", color: "#feca57", img: "images/0004.png", pt: 10, isWish: false },   // 0.8%
            { weight: 20, title: "🎫 专属许愿券", desc: "实体许愿+1", color: "#ff7675", img: "images/0007.png", pt: 0, isWish: true },  // 0.2% (SSR极稀有)
            { weight: 6000, title: "💖 爱心抱枕", desc: "+1.0 碎片", color: "#ff9ff3", img: "images/0005.png", pt: 1.0, isWish: false }, // 60.0% (高频微亏，掩盖视觉亏损)
            { weight: 3865, title: "☁️ 棉花糖", desc: "+0.5 碎片", color: "#a4b0be", img: "images/0006.png", pt: 0.5, isWish: false }   // 38.65%
        ];
    }

    function getRandomBoxItem(rewardsArray) {
        let rand = Math.floor(Math.random() * 10000);
        let sum = 0;
        for (let item of rewardsArray) {
            sum += item.weight;
            if (rand < sum) return item;
        }
        return rewardsArray[6]; 
    }

    function openBlindBox(times) {
        if (isSystemBusy) return;

        let cost = times * 1.5;

        if (currentScore < cost) {
            alert(`❌ 余额不足！\n抽取 ${times} 次需要 ${cost} 积分，你只有 ${currentScore} 分。\n还不快去找奕奕哥哥撒娇求包养！`);
            return;
        }

        let confirmMsg = times === 1 ? `花费 1.5 积分开启盲盒？` : `⚠️ 疯狂模式！将扣除 15 积分进行十连抽，确定吗？`;
        if (!confirm(confirmMsg)) return;

        isSystemBusy = true;
        updateScoreUI(-cost, 0);

        let icon = document.getElementById('boxIcon');
        let listWrap = document.getElementById('boxResultList');
        let summary = document.getElementById('boxSummary');
        
        icon.style.display = 'inline-block';
        listWrap.style.display = 'none';
        summary.style.display = 'none';
        icon.classList.add('shake');
        
        let activeRewards = getBoxRewards(); 

        setTimeout(() => {
            icon.classList.remove('shake');
            icon.style.display = 'none'; 
            
            listWrap.innerHTML = '';
            let totalEarned = 0;
            let wishTicketsWon = 0;

            for(let i=0; i<times; i++) {
                let item = getRandomBoxItem(activeRewards);
                totalEarned += item.pt;
                if(item.isWish) wishTicketsWon++;

                let ptColor = item.isWish ? "#ff7675" : (item.pt > 1.5 ? "#1dd1a1" : "#a4b0be");

                listWrap.innerHTML += `
                    <div class="drawn-item">
                        <img src="${item.img}" alt="img" onerror="this.src=''; this.alt='🎁'; this.style.fontSize='30px';">
                        <div class="drawn-title" style="color:${item.color}">${item.title}</div>
                        <div class="drawn-pt" style="color:${ptColor}">${item.desc}</div>
                    </div>
                `;
            }

            // 实时增加碎片与许愿券
            updateScoreUI(totalEarned, wishTicketsWon);

            let wishMsg = wishTicketsWon > 0 ? `<br><span style='color:#ff7675; font-size:16px;'>🎉 抽中 ${wishTicketsWon} 张【许愿券】！快截图去向哥哥许愿！</span>` : "";

            // 🚀 隐藏利润：只显示获得的碎片总数
            summary.innerHTML = `总计获得: ${Math.round(totalEarned*10)/10} 碎片 ${wishMsg}`;
            
            listWrap.style.display = 'flex';
            summary.style.display = 'block';
            isSystemBusy = false;
        }, 800);
    }

    // ==========================================
    // 🎲 命运骰子逻辑 (无限免费坑人版 + 破产防堵机制)
    // ==========================================
    function rollDice(num) {
        if (isSystemBusy) return;

        // 🛑 新增：破产防堵机制！负数禁止游玩！
        if (currentScore < 0) {
            alert(`❌ 负债警报！\n小笨蛋，你目前的分数是 ${currentScore} 分，已经破产啦！\n负债状态下禁止掷骰子，快去跟奕奕哥哥撒娇、做任务赚积分还债！`);
            return;
        }
        
        // 🚀 完全免费，无需扣除入场费！
        isSystemBusy = true;
        
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        // 方案B 计分：1点~6点 对应 -3, -2, -1, 0, 2, 3
        const dicePoints = [-3, -2, -1, 0, 2, 3]; 
        
        let resultBox = document.getElementById('diceResult');
        let descBox = document.getElementById('diceDesc');
        
        resultBox.innerHTML = '';
        for(let i=0; i<num; i++) {
            resultBox.innerHTML += `<div class="dice-wrapper"><div class="dice" id="die-${i}">❓</div><div id="die-pt-${i}" style="font-size:12px; color:#a4b0be; height:14px; font-weight:bold;"></div></div>`;
        }
        
        if(descBox) {
            descBox.innerText = "命运疯狂转动中...";
            descBox.style.color = "#ffffff";
        }

        let animCounter = 0;
        let interval = setInterval(() => {
            for(let i=0; i<num; i++) {
                document.getElementById(`die-${i}`).innerText = diceFaces[Math.floor(Math.random() * 6)];
            }
            animCounter++;
            
            if(animCounter > 10) {
                clearInterval(interval);
                let totalDicePoints = 0;
                
                for(let i=0; i<num; i++) {
                    let finalIndex = Math.floor(Math.random() * 6);
                    let pt = dicePoints[finalIndex];
                    totalDicePoints += pt;
                    
                    document.getElementById(`die-${i}`).innerText = diceFaces[finalIndex];
                    let ptDisplay = pt > 0 ? "+" + pt : pt;
                    document.getElementById(`die-pt-${i}`).innerText = ptDisplay;
                    document.getElementById(`die-pt-${i}`).style.color = pt > 0 ? "#1dd1a1" : (pt < 0 ? "#ee5253" : "#a4b0be");
                }
                
                // 实时加入骰子得分 (0成本)
                updateScoreUI(totalDicePoints, 0);

                let netColor = totalDicePoints > 0 ? "#1dd1a1" : (totalDicePoints < 0 ? "#ee5253" : "#48dbfb");
                
                if(descBox) {
                    descBox.innerHTML = `点数合计：<span style="font-size:20px; font-weight:bold; color:${netColor}">${totalDicePoints > 0 ? '+'+totalDicePoints : totalDicePoints} 积分</span>`;
                }
                isSystemBusy = false;
            }
        }, 60);
    }

    // ==========================================
    // 🔮 占卜逻辑
    // ==========================================
    const fortunes = [
        { title: "🌟 上上签 (+3分)", color: "#feca57", pt: 3, descs: ["运气爆棚！系统已自动为你加上 3 分！"] },
        { title: "✨ 中上签 (+1分)", color: "#1dd1a1", pt: 1, descs: ["顺风顺水！系统已自动为你加上 1 分！"] },
        { title: "📄 平签 (0分)", color: "#48dbfb", pt: 0, descs: ["无事发生。乖乖做任务吧。"] },
        { title: "🌧️ 中下签 (-1分)", color: "#ff9f43", pt: -1, descs: ["有点倒霉，系统自动扣除 1 分。"] },
        { title: "💀 下下签 (-3分)", color: "#ee5253", pt: -3, descs: ["大凶！系统无情扣除 3 分！建议找哥哥化解厄运！"] }
    ];

    let savedFortune = localStorage.getItem('tidu_dailyFortune');
    if (savedFortune) {
        let f = JSON.parse(savedFortune);
        document.getElementById('fortuneResult').innerText = f.title;
        document.getElementById('fortuneResult').style.color = f.color;
        document.getElementById('fortuneDesc').innerText = f.desc;
        document.getElementById('fortuneDesc').style.color = f.color;
    }

    function drawFortune() {
        if (localStorage.getItem('tidu_dailyFortune')) {
            alert("温馨提示：你今天已经抽过签了喔！明天再来吧！");
            return;
        }

        let rand = Math.random();
        let fortune;
        if (rand < 0.1) fortune = fortunes[0];
        else if (rand < 0.3) fortune = fortunes[1];
        else if (rand < 0.7) fortune = fortunes[2];
        else if (rand < 0.9) fortune = fortunes[3];
        else fortune = fortunes[4];

        let desc = fortune.descs[0];

        updateScoreUI(fortune.pt, 0);

        document.getElementById('fortuneResult').innerText = fortune.title;
        document.getElementById('fortuneResult').style.color = fortune.color;
        document.getElementById('fortuneDesc').innerText = desc;
        document.getElementById('fortuneDesc').style.color = fortune.color;

        localStorage.setItem('tidu_dailyFortune', JSON.stringify({
            title: fortune.title, desc: desc, color: fortune.color
        }));
    }
</script>

</body>
</html>
