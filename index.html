<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>专属提督碎片系统 🧩</title>
    <style>
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            padding: 25px 20px;
            box-sizing: border-box;
            background: linear-gradient(145deg, #1f1f3a, #161625);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00d2d3;
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .score-board {
            background: rgba(255, 255, 255, 0.05);
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #00d2d3;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 210, 211, 0.15);
            position: relative;
        }
        .score-title {
            font-size: 14px;
            color: #a4b0be;
            margin-bottom: 8px;
        }
        .score-value {
            font-size: 40px;
            font-weight: 800;
            color: #feca57;
            text-shadow: 0 2px 10px rgba(254, 202, 87, 0.3);
            transition: all 0.3s ease;
        }
        .score-total {
            font-size: 18px;
            color: #ffffff;
        }
        .section {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .section h3 {
            margin: 0 0 10px 0;
            color: #ff9ff3;
            font-size: 18px;
        }
        .section p {
            font-size: 13px;
            color: #ced6e0;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .rules {
            font-size: 12px;
            color: #feca57;
            background: rgba(254, 202, 87, 0.1);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.5;
        }
        .dice {
            font-size: 65px;
            margin: 10px 0;
            line-height: 1;
        }
        .dice-desc {
            font-size: 15px;
            color: #00d2d3;
            min-height: 22px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .fortune-text {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }
        .fortune-desc {
            font-size: 15px;
            color: #00d2d3;
            min-height: 44px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        button {
            background: linear-gradient(135deg, #00d2d3, #0984e3);
            color: #ffffff;
            border: none;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: scale(0.96);
        }
        .tips {
            font-size: 12px;
            color: #747d8c;
            margin-top: auto;
            padding-top: 20px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🧩 专属提督碎片系统 🧩</h1>
    
    <div class="score-board">
        <div class="score-title">当前持有碎片 (本地同步)</div>
        <div class="score-value" id="displayScore">0<span class="score-total"> / 999</span></div>
    </div>

    <div class="section">
        <h3>🎲 命运骰子</h3>
        <p>系统临时任务专用（需截图回传 GM 报备）</p>
        <div class="rules">
            6点: +4分 | 5点: +3分 | 4点: +1分<br>
            3点: 0分 &nbsp;| 2点: -1分 | 1点: -3分<br>
            <span style="color:#ff9f43;">* 每日免费 3 次，之后每次需消耗 1 积分</span>
        </div>
        <div class="dice" id="diceResult">❓</div>
        <div class="dice-desc" id="diceDesc">今日免费剩余次数: 3</div>
        <button onclick="rollDice()">点击掷骰</button>
    </div>

    <div class="section">
        <h3>🔮 每日运势占卜</h3>
        <p>每日限抽一次，抽完请截图发给 GM 报备<br>（未报备者当日运势与分数无效）</p>
        <div class="fortune-text" id="fortuneResult">等待抽签...</div>
        <div class="fortune-desc" id="fortuneDesc"></div>
        <button onclick="drawFortune()" id="fortuneBtn">抽取今日运势</button>
    </div>

    <div class="tips">
        * 本客户端由 奕奕哥哥 独家开发维运<br>
        * 请妥善保存 GM 发放的专属加分连结
    </div>
</div>

<script>
    // ----------------------------------------------------
    // 核心机制 1：本地分数初始化與讀取
    // ----------------------------------------------------
    let currentScore = parseInt(localStorage.getItem('tidu_score') || '18.5'); // 初始預設 -1
    document.getElementById('displayScore').innerHTML = currentScore + '<span class="score-total"> / 999</span>';

    // ----------------------------------------------------
    // 核心机制 2：GM 神奇連結 (Magic Link) 發放分數
    // 用法：發送網址 ?add=分數&key=防重複碼
    // 範例：https://你的網址.github.io/?add=3&key=test1
    // ----------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const addScore = urlParams.get('add'); // 要加或扣的分数
    const setScore = urlParams.get('set'); // 强制覆盖成某分数 (用于校正)
    const key = urlParams.get('key');      // 防作弊密钥

    if ((addScore || setScore) && key) {
        let usedKeys = JSON.parse(localStorage.getItem('tidu_usedKeys') || '[]');
        
        if (usedKeys.includes(key)) {
            alert("⚠️ 贪心抓包！该 GM 奖励/惩罚连结已经使用过了！");
        } else {
            if (setScore) {
                // 强制校正分数模式
                currentScore = parseInt(setScore);
                alert(`🔧 GM 后台强制介入，分数已校正为：${currentScore} 分！`);
            } else if (addScore) {
                // 加扣分模式
                let point = parseInt(addScore);
                currentScore += point;
                let word = point > 0 ? "发放的奖励" : "下达的惩罚";
                alert(`🎉 成功接收 GM ${word}：${point > 0 ? '+'+point : point} 积分！\n目前总积分：${currentScore}`);
            }
            
            // 存入新分数
            localStorage.setItem('tidu_score', currentScore.toString());
            document.getElementById('displayScore').innerHTML = currentScore + '<span class="score-total"> / 999</span>';
            
            // 记录该密钥已使用
            usedKeys.push(key);
            localStorage.setItem('tidu_usedKeys', JSON.stringify(usedKeys));
        }
        
        // 自动清除网址后面的参数，保持画面干净，也防止她一直按重新整理
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // ----------------------------------------------------
    // 核心机制 3：每日状态重置
    // ----------------------------------------------------
    let today = new Date().toDateString();
    if (localStorage.getItem('tidu_dailyDate') !== today) {
        localStorage.setItem('tidu_dailyDate', today);
        localStorage.setItem('tidu_diceCount', '0');
    }

    function updateDiceUI() {
        let count = parseInt(localStorage.getItem('tidu_diceCount') || '0');
        let descBox = document.getElementById('diceDesc');
        if (count < 3) {
            descBox.innerText = "今日免费剩余次数: " + (3 - count);
            descBox.style.color = "#00d2d3";
        } else {
            descBox.innerText = "今日免费次数已用尽 (每次需耗费1分)";
            descBox.style.color = "#ff9f43";
        }
    }
    updateDiceUI();

    // ----------------------------------------------------
    // 骰子与占卜逻辑 (与上一版相同)
    // ----------------------------------------------------
    function rollDice() {
        let count = parseInt(localStorage.getItem('tidu_diceCount') || '0');
        
        if (count >= 3) {
            let buy = confirm("⚠️ 今日 3 次免费掷骰已用尽！\n继续掷骰将【消耗 1 积分】当作入场费，请确认是否继续？\n（需截图给 GM 结算扣除）");
            if (!buy) return; 
        }

        localStorage.setItem('tidu_diceCount', count + 1);
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        const dicePoints = [-3, -1, 0, 1, 3, 4]; 
        
        let resultBox = document.getElementById('diceResult');
        let descBox = document.getElementById('diceDesc');
        let animCounter = 0;
        
        descBox.innerText = "命运判定中...";
        descBox.style.color = "#ffffff";

        let interval = setInterval(() => {
            resultBox.innerText = diceFaces[Math.floor(Math.random() * 6)];
            animCounter++;
            if(animCounter > 10) {
                clearInterval(interval);
                let finalIndex = Math.floor(Math.random() * 6);
                let pointChange = dicePoints[finalIndex];
                let pointStr = pointChange > 0 ? "+" + pointChange : pointChange;
                
                resultBox.innerText = diceFaces[finalIndex];
                let prefix = (count >= 3) ? "【已扣除1分入场费】" : "";
                descBox.innerText = prefix + "掷出 " + (finalIndex + 1) + " 点，积分 " + pointStr + "！";
                
                if (pointChange > 0) descBox.style.color = "#1dd1a1"; 
                else if (pointChange < 0) descBox.style.color = "#ee5253"; 
                else descBox.style.color = "#48dbfb"; 
                
                setTimeout(updateDiceUI, 3000);
            }
        }, 60);
    }

    const fortunes = [
        { title: "🌟 上上签 (+3分)", color: "#feca57", descs: ["运气爆棚！今天非常适合撒娇，GM 审核通过率极高。","欧气满满！天选之子就是你，赶紧去找 GM 领赏吧！","吉星高照！今天提任何要求 GM 都可能答应，快去截图报备！"] },
        { title: "✨ 中上签 (+1分)", color: "#1dd1a1", descs: ["运势不错，发张可爱的照片给 GM，大概率能获得额外奖励。","顺风顺水！今天对 GM 甜言蜜语会有意想不到的收获。","小吉之日，适合乖乖做任务，GM 看你顺眼可能会爆击加分。"] },
        { title: "📄 平签 (0分)", color: "#48dbfb", descs: ["平平无奇的一天。乖乖完成日常打卡早晚安，不要作妖。","无事发生。今天宜安分守己，切勿轻易挑衅 GM 的底线。","普普通通。按部就班解任务即可，没有惊喜也没有惊吓。"] },
        { title: "🌧️ 中下签 (-1分)", color: "#ff9f43", descs: ["有点危险，今天请谨言慎行，千万别说「不准」等违禁词。","诸事不宜。今天惹 GM 生气的机率极高，建议多夸夸他保平安。","乌云盖顶，今天系统心情一般，连呼吸都可能被扣分，请小心行事。"] },
        { title: "💀 下下签 (-3分)", color: "#ee5253", descs: ["大凶！背后凉飕飕，建议立刻呼叫「奕奕哥哥」化解厄运！","完蛋了！系统检测到你今天有造反倾向，速速去跟 GM 撒娇认错！","极度危险！你的碎片岌岌可危，今天除了叫哥哥，没有别的保命方法了。"] }
    ];

    function drawFortune() {
        let lastDrawDate = localStorage.getItem('tidu_lastDrawDate_v2');
        let savedTitle = localStorage.getItem('tidu_fortuneTitle_v2');
        let savedDesc = localStorage.getItem('tidu_fortuneDesc_v2');
        let savedColor = localStorage.getItem('tidu_fortuneColor_v2');
        
        let titleBox = document.getElementById('fortuneResult');
        let descBox = document.getElementById('fortuneDesc');

        if (lastDrawDate === today) {
            alert("⚠️ 系统警告：你今天已经抽过签了！\n请拿这个结果去跟 GM 报备，不许耍赖！");
            titleBox.innerText = savedTitle;
            titleBox.style.color = savedColor;
            descBox.innerText = savedDesc;
            descBox.style.color = savedColor;
            return;
        }

        let rand = Math.random();
        let fortune;
        if (rand < 0.1) fortune = fortunes[0];
        else if (rand < 0.3) fortune = fortunes[1];
        else if (rand < 0.7) fortune = fortunes[2];
        else if (rand < 0.9) fortune = fortunes[3];
        else fortune = fortunes[4];

        let randomDesc = fortune.descs[Math.floor(Math.random() * fortune.descs.length)];

        titleBox.innerText = fortune.title;
        titleBox.style.color = fortune.color;
        descBox.innerText = randomDesc;
        descBox.style.color = fortune.color;

        localStorage.setItem('tidu_lastDrawDate_v2', today);
        localStorage.setItem('tidu_fortuneTitle_v2', fortune.title);
        localStorage.setItem('tidu_fortuneDesc_v2', randomDesc);
        localStorage.setItem('tidu_fortuneColor_v2', fortune.color);
    }
</script>

</body>
</html>
